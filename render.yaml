services:
  - type: web
    name: gopher-boys-crm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/gopher.db
      - key: PYTHON_VERSION
        value: "3.12"
    disk:
      name: gopher-data
      mountPath: /var/data
      sizeGB: 1
