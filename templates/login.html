<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Gopher Boys CRM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
</head>
<body class="login-page">
  <div class="login-card card">
    <div class="login-brand">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Gopher Boys">
      <strong>GOPHER BOYS CRM</strong>
      <span>{{ SLOGAN }}</span>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-wrap">
          {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <div class="form-actions">
        <button class="btn btn-mint" type="submit" style="width:100%">Sign in</button>
      </div>
    </form>
    <p class="muted" style="text-align:center;margin-top:1rem;font-size:0.85rem">
      Based in {{ SERVICE_AREA }}
    </p>
  </div>
</body>
</html>
